name: Test Instagram API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-instagram:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          META_IG_ACCESS_TOKEN: ${{ secrets.META_IG_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
        run: |
          test -n "$META_IG_ACCESS_TOKEN" || (echo "Missing META_IG_ACCESS_TOKEN" && exit 1)
          test -n "$META_IG_USER_ID" || (echo "Missing META_IG_USER_ID" && exit 1)

      - name: Verify Instagram connection
        env:
          META_IG_ACCESS_TOKEN: ${{ secrets.META_IG_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
        run: |
          TOKEN="$(printf '%s' "$META_IG_ACCESS_TOKEN" | tr -d '\r\n')"
          EXPECTED_ID="$(printf '%s' "$META_IG_USER_ID" | tr -d '\r\n ')"

          HTTP_CODE=$(curl -sS -G -o /tmp/ig-response.json -w "%{http_code}" \
            "https://graph.instagram.com/me" \
            --data-urlencode "fields=id,user_id,username" \
            --data-urlencode "access_token=$TOKEN")

          export HTTP_CODE EXPECTED_ID

          python3 - <<'PY'
          import json, os
          from pathlib import Path

          p = Path("/tmp/ig-response.json")
          try:
              data = json.loads(p.read_text())
          except Exception:
              print("Instagram returned a non-JSON response.")
              raise SystemExit(1)

          if "error" in data:
              err = data["error"]
              print("Instagram API error:", err.get("message", "Unknown error"))
              print("Error type:", err.get("type", "unknown"))
              print("Error code:", err.get("code", "unknown"))
              raise SystemExit(1)

          http_code = int(os.environ["HTTP_CODE"])
          if not 200 <= http_code < 300:
              print("Unexpected HTTP status:", http_code)
              raise SystemExit(1)

          returned_id = str(data.get("user_id") or data.get("id") or "")
          expected_id = os.environ["EXPECTED_ID"]

          print("Connection OK")
          print("Instagram username:", data.get("username", "(not returned)"))
          print("Instagram user object resolved successfully.")

          if expected_id and returned_id and expected_id != returned_id:
              print("Warning: returned Instagram user ID does not match META_IG_USER_ID.")
              print("Returned ID:", returned_id)
              raise SystemExit(1)
          PY
